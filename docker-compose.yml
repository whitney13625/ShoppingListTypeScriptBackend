
services:
  # 1. Your TypeScript Application
  app:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000" # Map host port 3000 to container port 3000
    environment:
      # Connection details for the database
      # IMPORTANT: DB_HOST must match the service name 'db' below, not 'localhost'
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - db
    restart: on-failure

  # 2. PostgreSQL Database
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # Open port 5432 so you can connect via SQL client tools
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
