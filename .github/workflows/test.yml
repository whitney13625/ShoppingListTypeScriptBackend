name: Node.js CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Generate .env.test for Docker Compose to read
    - name: Create .env.test file
      run: |
        echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env.test
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env.test
        echo "POSTGRES_DB=${{ vars.POSTGRES_DB }}" >> .env.test
        echo "DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5433/${{ vars.POSTGRES_DB }}" >> .env.test

    - run: npm ci
    
    # Run original test command: docker compose -f docker-compose.test.yml up 
    - name: Run Integration Tests
      run: npm run test:integration